[project]
name = "mjwarp-unity-demo"
version = "0.1.0"
description = "MJWarp authoritative physics backend for the Unity embodied-data demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h5py>=3.12,<4",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "numpy>=2.0,<3",
  "pyarrow>=18,<24",
  "warp-lang>=1.14",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]
training = [
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "integration: requires a CUDA-capable GPU and MJWarp runtime",
]
testpaths = ["tests"]
